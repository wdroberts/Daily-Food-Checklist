<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2d6a4f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Daily nutrient and food checklist">
  <title>Daily Checklist</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Setup Screen -->
  <div id="setup" class="screen">
    <div class="setup-card">
      <div class="setup-icon">🐟</div>
      <h1>Daily Checklist</h1>
      <p>Choose your <strong>2 sardine days</strong> per week.</p>
      <div class="day-grid" id="day-grid">
        <button class="day-btn" data-day="1">Mon</button>
        <button class="day-btn" data-day="2">Tue</button>
        <button class="day-btn" data-day="3">Wed</button>
        <button class="day-btn" data-day="4">Thu</button>
        <button class="day-btn" data-day="5">Fri</button>
        <button class="day-btn" data-day="6">Sat</button>
        <button class="day-btn" data-day="0">Sun</button>
      </div>
      <button id="setup-btn" class="primary-btn" disabled>Get Started</button>
    </div>
  </div>

  <!-- Main Screen -->
  <div id="main" class="screen hidden">

    <header class="app-header">
      <div class="header-row">
        <h1 class="app-title">Daily Checklist</h1>
        <button class="icon-btn" id="menu-btn" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
          </svg>
        </button>
      </div>
      <div class="stats-row">
        <div class="streak-display">
          <span class="streak-flame">🔥</span>
          <span id="streak-count">0</span>
          <span class="streak-label">day streak</span>
          <span class="best-streak" id="best-streak"></span>
        </div>
        <div class="progress-display" id="progress-text">0 / 0</div>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </header>

    <!-- Overflow menu -->
    <div id="overflow-menu" class="overflow-menu hidden">
      <button class="menu-item" id="export-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>
        Export data
      </button>
      <button class="menu-item" id="change-days-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
        </svg>
        Change sardine days
      </button>
    </div>
    <div id="overlay" class="overlay hidden"></div>

    <main class="content-area">
      <div class="week-strip" id="week-strip"></div>
      <div id="checklist"></div>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
