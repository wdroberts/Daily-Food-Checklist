<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2d6a4f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Daily nutrient and food checklist">
  <title>Daily Checklist</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Main Screen -->
  <div id="main" class="screen">

    <header class="app-header">
      <div class="header-row">
        <h1 class="app-title">Daily Checklist</h1>
        <button class="icon-btn" id="menu-btn" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
          </svg>
        </button>
      </div>
      <div class="stats-row">
        <div class="streak-display">
          <span class="streak-flame">🔥</span>
          <span id="streak-count">0</span>
          <span class="streak-label">day streak</span>
          <span class="best-streak" id="best-streak"></span>
        </div>
        <div class="progress-display" id="progress-text">0 / 0</div>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </header>

    <!-- Overflow menu -->
    <div id="overflow-menu" class="overflow-menu hidden">
      <button class="menu-item" id="export-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>
        Export data
      </button>
      <button class="menu-item" id="graph-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M3 3v18h18v-2H5V3H3zm4 10l3-3 3 3 5-5 1.41 1.41L13 15.83l-3-3-3 3L7 13z"/>
        </svg>
        View progress
      </button>
    </div>
    <div id="overlay" class="overlay hidden"></div>

    <main class="content-area">
      <div class="week-strip" id="week-strip"></div>
      <div id="checklist"></div>
    </main>

  </div>

  <!-- Graph Modal -->
  <div id="graph-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title">Last 30 Days</span>
        <button class="icon-btn modal-close" id="graph-close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>
      <div id="graph-chart"></div>
      <div class="graph-legend">
        <span class="legend-dot" style="background:#52b788"></span>100%
        <span class="legend-dot" style="background:#95d5b2"></span>50–99%
        <span class="legend-dot" style="background:#f5c6c2"></span>&lt;50%
        <span class="legend-dot" style="background:#eeeeee"></span>None
      </div>
      <div id="graph-stats" class="graph-stats"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
